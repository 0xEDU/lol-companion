[package]
name = "lol-companion"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[target.'cfg(windows)'.dependencies]
gpui = { version = "=0.2.2", default-features = false }
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[build-dependencies]
embed-resource = "3.0.12"
